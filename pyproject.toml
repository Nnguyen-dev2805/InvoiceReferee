[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-referee"
version = "0.1.0"
description = "Expense-reimbursement MVP: verify evidence/rules and create payment requests (B1 rebuild)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
    # Thin transport for the Mistral OCR + Kimi/Moonshot JSON APIs (T05). Chosen
    # over the heavy official `mistralai` SDK (httpx2 + jsonpath-python) for one
    # endpoint; see docs/evidence/provider-contract.md.
    "httpx>=0.27,<1",
    # W03 reader: native PDF text extraction (pypdfium2, single-threaded executor)
    # and image/representation handling with pixel limits (Pillow).
    "pypdfium2>=4,<5",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
