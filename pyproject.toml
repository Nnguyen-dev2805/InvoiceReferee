[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-referee"
version = "0.1.0"
description = "Accounting document intake and review agent"
requires-python = ">=3.12"
dependencies = [
    "mistralai==2.10.1",
    "Pillow>=10,<13",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "streamlit==1.50.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
