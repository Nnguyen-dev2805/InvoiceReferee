[project]
name = "invoice-referee"
version = "0.1.0"
description = "Post-activity employee expense settlement referee"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=12.3.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pypdf>=5",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.9",
    "reportlab>=5.0.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
invoice-referee = "invoice_referee.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_referee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
