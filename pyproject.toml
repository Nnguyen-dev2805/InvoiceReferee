[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-referee"
version = "0.1.0"
description = "AI Purchase Invoice Review & Escalation Agent (Sprint 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
